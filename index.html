<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>제철 산지 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 달 고르기 → 바다 위 한반도 남쪽 지도(산지마다 그림 핀) → 그림 카드 목록 */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --ink:#22302d; --muted:#667873; --line:#dbe5e1;
  --accent:#1f6f8b;
  --sea1:#d6ecf3; --sea2:#bfe0ea;
  --land0:#e8ecdf; --land1:#d8e6c6; --land2:#c2daa8; --land3:#a7ca88; --land4:#88b768;
  --border:#ffffff; --label:#4b5d4f;
  --pin:#fffdf8; --pinRing:#22302d;
  --sea:#2f7fb8; --veg:#3f9a52; --fruit:#e0632f; --mtn:#9a7440;
  --seaT:#e3f0f9; --vegT:#e6f4e7; --fruitT:#fde9df; --mtnT:#f3ebdd;
  --display:"Jua", "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --body:"Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172220; --ink:#e7efec; --muted:#9aaea8; --line:#2a3936;
  --accent:#7cc6e0;
  --sea1:#12293a; --sea2:#0e2230;
  --land0:#27322c; --land1:#2f4532; --land2:#3a5a39; --land3:#4a7444; --land4:#5f9152;
  --border:#0e2230; --label:#c5d6c9;
  --pin:#f6f2e8; --pinRing:#e7efec;
  --sea:#6eb3e6; --veg:#78c98a; --fruit:#f2936a; --mtn:#d1a96e;
  --seaT:#1b2d3a; --vegT:#1c2f22; --fruitT:#352419; --mtnT:#302819;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --ink:#e7efec; --muted:#9aaea8; --line:#2a3936;
  --accent:#7cc6e0;
  --sea1:#12293a; --sea2:#0e2230;
  --land0:#27322c; --land1:#2f4532; --land2:#3a5a39; --land3:#4a7444; --land4:#5f9152;
  --border:#0e2230; --label:#c5d6c9;
  --pin:#f6f2e8; --pinRing:#e7efec;
  --sea:#6eb3e6; --veg:#78c98a; --fruit:#f2936a; --mtn:#d1a96e;
  --seaT:#1b2d3a; --vegT:#1c2f22; --fruitT:#352419; --mtnT:#302819;
  color-scheme:dark; }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.15;margin:0;text-wrap:balance}
h1 .m{color:var(--accent)}
.sub{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

.months{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.months button{flex:0 0 auto;font:400 15px var(--display);color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.months button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.months button.now::after{content:"";position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--fruit)}
button:focus-visible,.prov:focus-visible,.pin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mapcard{background:linear-gradient(170deg,var(--sea1),var(--sea2));border-radius:20px;padding:10px;position:relative}
.mapcard svg{width:100%;max-width:460px;height:auto;margin:0 auto;display:block}
.prov{cursor:pointer;stroke:var(--border);stroke-width:1.4;stroke-linejoin:round;transition:fill .3s, opacity .3s}
.prov.sel{stroke:var(--accent);stroke-width:2.4}
.dim .prov:not(.sel){opacity:.45}
.plabel{font:400 11px var(--display);fill:var(--label);pointer-events:none;letter-spacing:.04em}
.pin{cursor:pointer}
.pin .pop{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.6,1) both}
.pin circle.bg{fill:var(--pin);stroke:var(--pinRing);stroke-opacity:.18;stroke-width:1}
.pin.on circle.bg{stroke:var(--accent);stroke-opacity:1;stroke-width:2}
.dim .pin.out{opacity:.25}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.tip rect{fill:var(--surface);stroke:var(--line)}
.tip text{font:400 11px var(--body);fill:var(--ink)}
.tip text.t{font:400 12.5px var(--display)}
.maphint{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 2px}

.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.listhead h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.clear{font:400 14px var(--display);background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:400 14px var(--display);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.filters button[aria-pressed="false"]{opacity:.4}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

.group{display:flex;flex-direction:column;gap:8px}
.group h3{font:400 15px var(--display);color:var(--muted);margin:10px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:48px 1fr;gap:4px 10px;align-items:center;min-width:0}
.card .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;grid-row:1 / span 2;background:var(--t)}
.card .ic svg{width:36px;height:36px}
.card .name{font:400 16px var(--display);line-height:1.2;display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.card .place{font-size:12px;color:var(--muted);line-height:1.3}
.tag{font:400 11px var(--body);border-radius:999px;padding:0 6px;color:var(--bg)}
.tag.first{background:var(--veg)} .tag.last{background:var(--fruit)}
.bar{grid-column:1 / -1;display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:4px}
.bar span{height:5px;border-radius:3px;background:var(--line)}
.bar span.on{background:var(--k)}
.bar span.cur{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--muted)}
.plabel{paint-order:stroke;stroke:var(--land0);stroke-width:3px;stroke-opacity:.7}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.note{font-size:12px;color:var(--muted);margin:0}
.card{cursor:pointer;transition:border-color .2s, box-shadow .2s}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .3s ease-out both}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.dhead{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.dhead .ic{width:56px;height:56px;border-radius:16px;background:var(--t);display:grid;place-items:center}
.dhead .ic svg{width:42px;height:42px}
.dname{font:400 22px var(--display);line-height:1.2}
.dplace{font-size:13px;color:var(--muted)}
.dclose{font:400 16px var(--body);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.dlabel{font:400 15px var(--display);color:var(--muted)}
.dishes{display:flex;flex-wrap:wrap;gap:6px}
.dish{display:inline-flex;align-items:center;gap:6px;padding:7px 13px 7px 10px;border-radius:999px;background:var(--t);color:var(--ink);text-decoration:none;font:400 15px var(--display);border:1px solid transparent}
.dish:hover{border-color:var(--k)}
.dish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dish svg{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){ .detail{animation:none} }
@media (prefers-reduced-motion:reduce){ .pin .pop{animation:none} .prov{transition:none} }
</style>

<div class="wrap">
  <header>
    <h1><span class="m" id="mTitle">11월</span>엔 어디서 뭐가 날까</h1>
    <div class="sub"><span class="chip" id="jeolgi"></span><span class="chip" id="countChip"></span></div>
  </header>

  <div class="months" id="months" role="group" aria-label="달 선택"></div>

  <section class="mapcard">
    <svg id="map" viewBox="0 0 300 420" role="img" aria-label="남한 시·도 지도와 제철 산지"></svg>
    <p class="maphint">그림을 누르면 만들 수 있는 요리가, 땅을 누르면 그 지역 목록이 나와요</p>
  </section>

  <section class="detail" id="detail" hidden aria-live="polite"></section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="listhead">
      <h2 id="listTitle">전국 제철 산지</h2>
      <button class="clear" id="clear" hidden>전국 보기</button>
    </div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
    <p class="note">수확·어획 시기는 해마다 날씨에 따라 1~2주씩 달라질 수 있어요. 카드 아래 막대는 1월부터 12월까지의 제철이에요.</p>
  </section>
</div>

/* ---------- 대표 요리 ---------- */

 "햇녹차":["녹차","녹차밥","녹차라떼"], "양파":["양파장아찌","양파볶음","양파전"], "마늘":GARLIC, "육쪽마늘":GARLIC,
 "감자":["감자전","감자조림","감자옹심이"], "옥수수":["찐옥수수","옥수수전","콘치즈"], "고추":["고추장아찌","고추전","풋고추 된장무침"],
 "고구마":["군고구마","고구마맛탕","고구마줄기볶음"], "햅쌀":["햅쌀밥","누룽지","식혜"], "생강":["생강차","생강청","편강"],
 "가을배추":["김장김치","배추전","배춧국"], "두릅":["두릅숙회","두릅전","두릅장아찌"], "곰취":["곰취쌈","곰취장아찌","곰취나물"],
 "송이":["송이구이","송이밥","송이산적"], "밤":["군밤","밤밥","밤조림"], "인삼":["삼계탕","인삼튀김","수삼 꿀절임"],
 "딸기":["딸기잼","딸기청","딸기 샌드위치"], "한라봉":["한라봉청","한라봉 에이드","한라봉 마멀레이드"], "노지 감귤":["귤청","귤잼","진피차"],
 "참외":["참외장아찌","참외무침","참외 샐러드"], "오디":["오디잼","오디청"], "매실":["매실청","매실장아찌","매실주"],
 "복분자":["복분자청","복분자잼","복분자주"], "수박":["수박화채","수박주스","수박껍질무침"], "복숭아":["복숭아 병조림","복숭아청","복숭아 콤포트"],
 "포도":["포도잼","포도즙","포도청"], "배":["배숙","배즙","배깍두기"], "대추":["대추차","대추고","대추칩"],
 "사과":["사과잼","사과청","사과파이"], "단감":["감말랭이","단감무침","단감 샐러드"], "유자":["유자차","유자 드레싱","유자청"],
 "곶감":["수정과","곶감 호두말이","곶감쌈"],
};
const BOWL = `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 7.5h12a6 5 0 0 1-12 0z" fill="var(--k)"/><path d="M5.5 5c0-1 1-1.2 1-2.4M9.5 5c0-1 1-1.2 1-2.4" stroke="var(--k)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>`;
function monthText(ms){
  const runs=[]; ms.forEach(m=>{const r=runs[runs.length-1]; if(r && (r[1]%12)+1===m) r[1]=m; else runs.push([m,m]);});
  return runs.map(([a,b])=>a===b?`${a}월`:`${a}~${b}월`).join(", ");
}

/* ---------- 상태 ---------- */
const NOW = new Date().getMonth()+1;
let month = NOW, region = null, picked = null;
const kindsOn = new Set(Object.keys(KINDS));
const $ = id => document.getElementById(id);
const prev = m => m===1?12:m-1, next = m => m===12?1:m+1;

$("months").innerHTML = Array.from({length:12},(_,i)=>i+1)
  .map(m=>`<button id="m${m}" data-m="${m}" class="${m===NOW?'now':''}" aria-pressed="false">${m}월</button>`).join("");
$("months").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return; month=+b.dataset.m; picked=null; render(true);});
$("filters").innerHTML = Object.entries(KINDS).map(([k,v])=>`<button id="k-${k}" data-k="${k}" aria-pressed="true"><span class="dot" style="background:var(--${k})"></span>${v}</button>`).join("");
$("filters").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return; const k=b.dataset.k;
  if(kindsOn.has(k)){ if(kindsOn.size>1) kindsOn.delete(k);} else kindsOn.add(k); picked=null; render(true);});
$("clear").addEventListener("click",()=>{region=null; render(false);});

const current = () => FOODS.filter(f=>f.months.includes(month) && kindsOn.has(f.kind));

/* 핀끼리 겹치지 않게 살짝 밀어내기 */
function layout(items){
  const pts = items.map(f=>{const [x,y]=P(f.lon,f.lat); return {f,x,y,ox:x,oy:y};});
  const R = 12.5;
  for(let it=0; it<80; it++){
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j]; let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
      if(d<2*R){ if(d<0.01){dx=(i%2?1:-1)*.7; dy=.7; d=1;} const push=(2*R-d)/2; dx/=d; dy/=d; a.x-=dx*push; a.y-=dy*push; b.x+=dx*push; b.y+=dy*push; }
    }
    pts.forEach(p=>{ p.x+= (p.ox-p.x)*.02; p.y+=(p.oy-p.y)*.02; p.x=Math.max(R,Math.min(300-R,p.x)); p.y=Math.max(R,Math.min(420-R,p.y)); });
  }
  return pts;
}

let lastPts = [];
function renderMap(items, animate){
  const cnt={}; ORDER.forEach(r=>cnt[r]=0); items.forEach(f=>cnt[f.r]++);
  const lv = n => n===0?0 : n===1?1 : n<=3?2 : n<=5?3 : 4;
  const poly = r => "M"+POLY[r].split(" ").map(k=>P(...N[k]).join(",")).join("L")+"Z";
  const [jx,jy]=P(126.55,33.38);
  let s = ORDER.map(r=>{
    const d = r==="jj" ? `M${jx-24},${jy}a24,10.5 0 1,0 48,0a24,10.5 0 1,0 -48,0Z` : poly(r);
    return `<path class="prov ${region===r?'sel':''}" data-r="${r}" d="${d}" fill="var(--land${lv(cnt[r])})" tabindex="0" role="button" aria-label="${REGION_NAMES[r]} ${cnt[r]}가지"/>`;
  }).join("");
  s += ISLANDS.map(([r,lon,lat,rx,ry])=>{const [x,y]=P(lon,lat); return `<ellipse class="prov ${region===r?'sel':''}" data-r="${r}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="var(--land${lv(cnt[r])})"/>`;}).join("");
  s += ORDER.map(r=>{const [x,y]=P(...LABELS[r]); return `<text class="plabel" x="${x}" y="${y}" text-anchor="middle">${REGION_NAMES[r]}</text>`;}).join("");
  const pts = layout(items); lastPts = pts;
  s += pts.map((p,i)=>`<g class="pin ${picked===p.f.id?'on':''} ${region&&p.f.r!==region?'out':''}" data-id="${p.f.id}" tabindex="0" role="button" aria-label="${p.f.name}, ${p.f.place}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">
      <g class="pop" style="animation-delay:${animate?i*18:0}ms${animate?'':';animation:none'}"><circle class="bg" r="12"/><svg x="-9" y="-9" width="18" height="18" viewBox="0 0 32 32">${I[p.f.ic[0]](...p.f.ic.slice(1))}</svg></g></g>`).join("");
  const pp = pts.find(p=>p.f.id===picked);
  if(pp){
    const t=pp.f.name, sub=`${REGION_NAMES[pp.f.r]} ${pp.f.place}`;
    const w = Math.max(t.length*13, sub.length*11) + 18, h=36;
    let x = pp.x - w/2, y = pp.y - 16 - h;
    if(y<2) y = pp.y + 16; x=Math.max(2,Math.min(298-w,x));
    s += `<g class="tip" pointer-events="none"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/><text class="t" x="${x+9}" y="${y+15}">${t}</text><text x="${x+9}" y="${y+29}">${sub}</text></g>`;
  }
  $("map").innerHTML = s;
  $("map").classList.toggle("dim", !!region);
}

function handleMap(target){
  const pin = target.closest(".pin");
  if(pin){ pick(+pin.dataset.id, false); return; }
  const pr = target.closest(".prov");
  if(pr){ const r=pr.dataset.r; region = region===r?null:r; picked=null; render(false); }
}
$("map").addEventListener("click",e=>handleMap(e.target));
$("map").addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ")return; e.preventDefault(); const id=e.target.dataset.id, r=e.target.dataset.r; handleMap(e.target);
  const f = id!==undefined ? $("map").querySelector(`.pin[data-id="${id}"]`) : $("map").querySelector(`path[data-r="${r}"]`); f&&f.focus(); });

function cardHTML(f){
  const first=f.months.length>1 && !f.months.includes(prev(month)), last=f.months.length>1 && !f.months.includes(next(month));
  const bar = Array.from({length:12},(_,i)=>`<span class="${f.months.includes(i+1)?'on':''} ${i+1===month?'cur':''}"></span>`).join("");
  return `<div class="card ${picked===f.id?'on':''}" data-id="${f.id}" role="button" tabindex="0" style="--k:var(--${f.kind});--t:var(--${f.kind}T)">
    <span class="ic">${icon(f.ic)}</span>
    <span class="name">${f.name}${first?'<span class="tag first">첫물</span>':''}${last?'<span class="tag last">끝물</span>':''}</span>
    <span class="place">${REGION_NAMES[f.r]} ${f.place}</span>
    <span class="bar" aria-label="제철 ${f.months.join(', ')}월">${bar}</span></div>`;
}
function renderList(items){
  const rs = region?[region]:ORDER;
  const html = rs.map(r=>{
    const l = items.filter(f=>f.r===r);
    if(!l.length) return region?`<p class="empty">${month}월에 ${REGION_NAMES[r]}에서 나는 대표 품목이 목록에 없어요. 다른 달이나 분류를 골라 보세요.</p>`:"";
    return `<div class="group">${region?"":`<h3>${REGION_NAMES[r]}</h3>`}<div class="cards">${l.map(cardHTML).join("")}</div></div>`;
  }).join("");
  $("list").innerHTML = html || `<p class="empty">고른 분류에 해당하는 품목이 없어요.</p>`;
}
function pick(id, fromList){
  picked = picked===id ? null : id;
  renderMap(current(), false); renderDetail();
  document.querySelectorAll("#list .card").forEach(c=>c.classList.toggle("on", +c.dataset.id===picked));
  if(fromList && picked!==null){
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("detail").scrollIntoView({block:"center", behavior: smooth?"smooth":"auto"});
  }
}
function renderDetail(){
  const d=$("detail"), f=FOODS.find(x=>x.id===picked);
  if(!f){ d.hidden=true; d.innerHTML=""; return; }
  const dishes = DISHES[f.name] || [];
  d.style.setProperty("--t", `var(--${f.kind}T)`); d.style.setProperty("--k", `var(--${f.kind})`);
  d.innerHTML = `<div class="dhead"><span class="ic">${icon(f.ic)}</span>
      <div><div class="dname">${f.name}</div><div class="dplace">${REGION_NAMES[f.r]} ${f.place} · ${monthText(f.months)} 제철</div></div>
      <button class="dclose" id="dclose" aria-label="닫기">✕</button></div>
    <div class="dlabel">이걸로 만들 수 있는 요리</div>
    <div class="dishes">${dishes.map(x=>`<a class="dish" href="https://www.10000recipe.com/recipe/list.html?q=${encodeURIComponent(x)}" target="_blank" rel="noopener">${BOWL}${x}</a>`).join("")}</div>
    <p class="note">요리 이름을 누르면 만개의레시피에서 조리법을 찾아 줘요.</p>`;
  d.hidden = false;
  $("dclose").addEventListener("click", ()=>pick(f.id, false));
}
$("list").addEventListener("click", e=>{ const c=e.target.closest(".card"); if(c) pick(+c.dataset.id, true); });
$("list").addEventListener("keydown", e=>{ if(e.key!=="Enter"&&e.key!==" ")return; const c=e.target.closest(".card"); if(!c)return; e.preventDefault(); pick(+c.dataset.id, true); });

function render(animate){
  const items = current();
  $("mTitle").textContent = `${month}월`;
  $("jeolgi").textContent = `절기 ${JEOLGI[month]}${month===NOW?' · 이번 달':''}`;
  $("countChip").textContent = `제철 ${items.length}가지`;
  document.querySelectorAll("#months button").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.m===month));
  document.querySelectorAll("#filters button").forEach(b=>b.setAttribute("aria-pressed", kindsOn.has(b.dataset.k)));
  $("listTitle").textContent = region?`${REGION_NAMES[region]}의 ${month}월 제철`:`전국 ${month}월 제철 산지`;
  $("clear").hidden = !region;
  renderMap(items, animate); renderList(items); renderDetail();
}
render(true);
const cur = $("m"+NOW); cur && cur.scrollIntoView && cur.scrollIntoView({inline:"center",block:"nearest"});
</script>
